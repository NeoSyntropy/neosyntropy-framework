[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neosyntropy"
version = "0.1.0"
description = "Deterministic AI workflow framework: nodes, edges, axioms, groups, and a control manager over finite-state graphs."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "NeoSyntropy" }]
keywords = ["ai", "agents", "workflow", "fsm", "deterministic", "control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.17",
]

[project.urls]
Homepage = "https://neosyntropy.com"
Documentation = "https://neosyntropy.com/docs"
Repository = "https://github.com/NeoSyntropy/neosyntropy-framework"
Issues = "https://github.com/NeoSyntropy/neosyntropy-framework/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "build>=1.2",
    "twine>=5",
]
bench = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]

[tool.setuptools.packages.find]
include = ["neosyntropy*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
