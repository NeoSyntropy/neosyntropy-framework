# Copy into .github/workflows/secret-scan.yml
name: Secret scan (NeoSyntropy)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install framework
        run: pip install -e .

      - name: Write tests/.env from GitHub secrets
        env:
          NEOSYNTROPY_API_KEY: ${{ secrets.NEOSYNTROPY_API_KEY }}
          NEOSYNTROPY_PROJECT_ID: ${{ secrets.NEOSYNTROPY_PROJECT_ID }}
        run: |
          mkdir -p tests
          cat > tests/.env <<EOF
          NEOSYNTROPY_API_KEY=${NEOSYNTROPY_API_KEY}
          NEOSYNTROPY_PROJECT_ID=${NEOSYNTROPY_PROJECT_ID}
          NEOSYNTROPY_API_URL=https://api.neosyntropy.com
          EOF

      - name: Scan repository for hardcoded secrets
        run: python cookbook/ci_secret_scan/run_example.py --repo "${GITHUB_WORKSPACE}"
